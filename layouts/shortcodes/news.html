  <script>
  
  const years = ['2024', '2025', '2026'];
  
  
  function showYear(year) {
  
    /* Hide all panels and reset buttons */
  
    years.forEach(function (y) {
  
      const panel =
        document.getElementById('news-' + y);
  
      const button =
        document.getElementById('btn-' + y);
  
  
      if (panel) {
        panel.style.display = 'none';
      }
  
  
      if (button) {
        button.classList.remove('active');
      }
  
    });
  
  
    /* Show selected panel */
  
    const activePanel =
      document.getElementById('news-' + year);
  
    const activeButton =
      document.getElementById('btn-' + year);
  
  
    if (activePanel) {
      activePanel.style.display = 'block';
    }
  
  
    if (activeButton) {
      activeButton.classList.add('active');
    }
  
  }
  
  </script>

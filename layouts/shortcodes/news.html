<script>
  const years = ['2024', '2025', '2026'];

  function showYear(year) {

    // Hide all panels and reset all buttons
    years.forEach(function (y) {

      const panel = document.getElementById('news-' + y);
      const button = document.getElementById('btn-' + y);

      if (panel) {
        panel.style.display = 'none';
      }

      if (button) {
        button.style.background = 'transparent';
        button.style.color = 'var(--color-primary-500)';
      }

    });


    // Show selected panel
    const activePanel = document.getElementById('news-' + year);
    const activeButton = document.getElementById('btn-' + year);

    if (activePanel) {
      activePanel.style.display = 'block';
    }

    if (activeButton) {
      activeButton.style.background = 'var(--color-primary-500)';
      activeButton.style.color = 'white';
    }

  }
</script>

<style>
    .news-container {
      display: block;
      width: 800px;  /* FIXED width - never changes */
      max-width: 800px;
      min-width: 800px;
      margin: 0 auto;
      border: 2px solid var(--color-primary-500);
      border-radius: 12px;
      padding: 1.5rem;
      box-sizing: border-box;
      background: rgba(128, 128, 128, 0.08);
      overflow-x: auto;  /* Adds scroll on small screens instead of resizing */
    }
  
    .news-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      min-height: 2.5rem;
      align-items: center;
    }
  
    .news-tabs button {
      padding: 0.4rem 1.2rem;
      border: 2px solid var(--color-primary-500);
      border-radius: 999px;
      background: transparent;
      color: var(--color-primary-500);
      cursor: pointer;
      font-weight: 600;
      min-width: 5rem;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
  
    .news-tabs button.active {
      background: var(--color-primary-500);
      color: white;
    }
  
    .news-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
  
    .news-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
  
    .news-date {
      min-width: 6rem;
      color: gray;
      font-size: 0.85rem;
      padding-top: 0.15rem;
      flex-shrink: 0;
    }
  
    .news-text {
      font-size: 0.95rem;
    }
  </style>
  
  <div class="news-container">
  
    <!-- Year tabs -->
    <div class="news-tabs">
  
      <button id="btn-2024" onclick="showYear('2024')" class="active">
        2024
      </button>
  
      <button id="btn-2025" onclick="showYear('2025')">
        2025
      </button>
  
      <button id="btn-2026" onclick="showYear('2026')">
        2026
      </button>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2024 -->
    <!-- ========================= -->
  
    <div id="news-2024" class="news-year-panel">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Aug 2024</span>
          <span class="news-text">🏆 <strong>Di-COT</strong> accepted at <strong>ICML 2024</strong>, Seoul, South Korea.</span>
        </li>
  
        <li class="news-item">
          <span class="news-date">Jun 2024</span>
          <span class="news-text">🎤 Presented poster at <strong>ICML 2024</strong>.</span>
        </li>
  
      </ul>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2025 -->
    <!-- ========================= -->
  
    <div id="news-2025" class="news-year-panel" style="display: none;">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Nov 2025</span>
          <span class="news-text">📄 Paper submitted to <strong>ICML 2026</strong>.</span>
        </li>
  
        <li class="news-item">
          <span class="news-date">Sep 2025</span>
          <span class="news-text">🎓 Passed PhD qualifying exam.</span>
        </li>
  
      </ul>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2026 -->
    <!-- ========================= -->
  
    <div id="news-2026" class="news-year-panel" style="display: none;">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Sep 2026</span>
          <span class="news-text">🚀 Started PhD at <strong>NTNU Trondheim</strong>.</span>
        </li>
  
      </ul>
  
    </div>
  
  </div>
  
  <script>
    const years = ['2024', '2025', '2026'];
  
    function showYear(year) {
  
      // Hide all panels and reset all buttons
      years.forEach(function (y) {
  
        const panel = document.getElementById('news-' + y);
        const button = document.getElementById('btn-' + y);
  
        if (panel) {
          panel.style.display = 'none';
        }
  
        if (button) {
          button.classList.remove('active');
        }
  
      });
  
      // Show selected panel
      const activePanel = document.getElementById('news-' + year);
      const activeButton = document.getElementById('btn-' + year);
  
      if (activePanel) {
        activePanel.style.display = 'block';
      }
  
      if (activeButton) {
        activeButton.classList.add('active');
      }
  
    }
  </script>

<style>
    .news-container {
      display: block;
      margin: 0 auto;
      border: 2px solid var(--color-primary-500);
      border-radius: 12px;
      padding: 1.5rem;
      box-sizing: border-box;
      background: rgba(128, 128, 128, 0.08);
      overflow-x: auto;
    }
  
    /* Mobile: fixed at 400px */
    @media (max-width: 480px) {
      .news-container {
        width: 400px;
        max-width: 400px;
        min-width: 400px;
        padding: 1rem;
        border-radius: 8px;
      }
      .news-tabs {
        gap: 0.3rem;
        margin-bottom: 1rem;
      }
      .news-tabs button {
        padding: 0.3rem 0.8rem;
        font-size: 0.75rem;
        min-width: 3.5rem;
      }
      .news-item {
        gap: 0.5rem;
      }
      .news-date {
        min-width: 4rem;
        font-size: 0.7rem;
      }
      .news-text {
        font-size: 0.8rem;
      }
      .news-list {
        gap: 0.5rem;
      }
    }
  
    /* Tablet: fixed at 600px */
    @media (min-width: 481px) and (max-width: 768px) {
      .news-container {
        width: 600px;
        max-width: 600px;
        min-width: 600px;
        padding: 1.2rem;
      }
      .news-tabs {
        gap: 0.5rem;
        margin-bottom: 1.2rem;
      }
      .news-tabs button {
        padding: 0.4rem 1rem;
        font-size: 0.85rem;
        min-width: 4.5rem;
      }
      .news-item {
        gap: 0.8rem;
      }
      .news-date {
        min-width: 5rem;
        font-size: 0.8rem;
      }
      .news-text {
        font-size: 0.9rem;
      }
      .news-list {
        gap: 0.8rem;
      }
    }
  
    /* Desktop: fixed at 800px */
    @media (min-width: 769px) {
      .news-container {
        width: 800px;
        max-width: 800px;
        min-width: 800px;
        padding: 1.5rem;
      }
      .news-tabs {
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      .news-tabs button {
        padding: 0.4rem 1.2rem;
        font-size: 0.95rem;
        min-width: 5rem;
      }
      .news-item {
        gap: 1rem;
      }
      .news-date {
        min-width: 6rem;
        font-size: 0.85rem;
      }
      .news-text {
        font-size: 0.95rem;
      }
      .news-list {
        gap: 1rem;
      }
    }
  
    .news-tabs {
      display: flex;
      flex-wrap: wrap;
      min-height: 2.5rem;
      align-items: center;
    }
  
    .news-tabs button {
      border: 2px solid var(--color-primary-500);
      border-radius: 999px;
      background: transparent;
      color: var(--color-primary-500);
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
  
    .news-tabs button.active {
      background: var(--color-primary-500);
      color: white;
    }
  
    .news-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
  
    .news-item {
      display: flex;
      align-items: flex-start;
    }
  
    .news-date {
      color: gray;
      padding-top: 0.15rem;
      flex-shrink: 0;
    }
  
    .news-text {
      word-wrap: break-word;
    }
  </style>
  
  <div class="news-container">
  
    <!-- Year tabs -->
    <div class="news-tabs">
  
      <button id="btn-2024" onclick="showYear('2024')" class="active">
        2024
      </button>
  
      <button id="btn-2025" onclick="showYear('2025')">
        2025
      </button>
  
      <button id="btn-2026" onclick="showYear('2026')">
        2026
      </button>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2024 -->
    <!-- ========================= -->
  
    <div id="news-2024" class="news-year-panel">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Aug 2024</span>
          <span class="news-text">🏆 <strong>Di-COT</strong> accepted at <strong>ICML 2024</strong>, Seoul, South Korea.</span>
        </li>
  
        <li class="news-item">
          <span class="news-date">Jun 2024</span>
          <span class="news-text">🎤 Presented poster at <strong>ICML 2024</strong>.</span>
        </li>
  
      </ul>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2025 -->
    <!-- ========================= -->
  
    <div id="news-2025" class="news-year-panel" style="display: none;">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Nov 2025</span>
          <span class="news-text">📄 Paper submitted to <strong>ICML 2026</strong>.</span>
        </li>
  
        <li class="news-item">
          <span class="news-date">Sep 2025</span>
          <span class="news-text">🎓 Passed PhD qualifying exam.</span>
        </li>
  
      </ul>
  
    </div>
  
    <!-- ========================= -->
    <!-- 2026 -->
    <!-- ========================= -->
  
    <div id="news-2026" class="news-year-panel" style="display: none;">
  
      <ul class="news-list">
  
        <li class="news-item">
          <span class="news-date">Sep 2026</span>
          <span class="news-text">🚀 Started PhD at <strong>NTNU Trondheim</strong>.</span>
        </li>
  
      </ul>
  
    </div>
  
  </div>
  
  <script>
    const years = ['2024', '2025', '2026'];
  
    function showYear(year) {
  
      // Hide all panels and reset all buttons
      years.forEach(function (y) {
  
        const panel = document.getElementById('news-' + y);
        const button = document.getElementById('btn-' + y);
  
        if (panel) {
          panel.style.display = 'none';
        }
  
        if (button) {
          button.classList.remove('active');
        }
  
      });
  
      // Show selected panel
      const activePanel = document.getElementById('news-' + year);
      const activeButton = document.getElementById('btn-' + year);
  
      if (activePanel) {
        activePanel.style.display = 'block';
      }
  
      if (activeButton) {
        activeButton.classList.add('active');
      }
  
    }
</script>
